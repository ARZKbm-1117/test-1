<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Semakan Markah PB - Kolej Matrikulasi Perak</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #1e3a8a;
      --primary-light: #3b82f6;
      --secondary: #0f172a;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #334155;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--surface);
      width: 100%;
      max-width: 800px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, var(--primary), #1e40af);
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .header p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 5px;
    }

    .search-section {
      padding: 30px 20px 10px 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--primary-light);
    }

    button.btn-search {
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
    }

    button.btn-search:hover {
      background: #1d4ed8;
    }

    .result-section {
      padding: 20px 30px 30px 30px;
      display: none;
    }

    .student-info {
      background: #f1f5f9;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
    }

    .info-item span {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .info-item strong {
      font-size: 1rem;
      color: var(--secondary);
    }

    .marks-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    .marks-table th, .marks-table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .marks-table th {
      background: #f8fafc;
      font-weight: 600;
      color: var(--secondary);
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s;
    }

    .btn-pdf {
      background: #ef4444;
      color: white;
    }

    .btn-print {
      background: #10b981;
      color: white;
    }

    .btn-action:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: #dc2626;
      text-align: center;
      padding: 10px;
      display: none;
    }

    /* Modal Styling */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 900px;
      height: 80vh;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      padding: 15px 20px;
      background: var(--secondary);
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-close {
      cursor: pointer;
      font-size: 1.2rem;
    }

    .modal-body {
      flex: 1;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Gaya Khas Semasa Mencetak (Print Stylesheet) */
    @media print {
      body {
        background: white;
        padding: 0;
      }
      .container {
        box-shadow: none;
        border: none;
        width: 100%;
        max-width: 100%;
      }
      .search-section, .action-buttons, .modal {
        display: none !important;
      }
      .result-section {
        display: block !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Kolej Matrikulasi Perak</h1>
      <p>Sistem Semakan Markah Pentaksiran Berterusan (PB)</p>
    </div>

    <div class="search-section">
      <div class="search-box">
        <input type="text" id="matrikInput" placeholder="Masukkan Nombor Matrik (cth: MS23123456)">
        <button class="btn-search" onclick="searchStudent()"><i class="fa-solid fa-magnifying-glass"></i> Cari</button>
      </div>
      <div id="errorMsg" class="error-msg">Nombor Matrik tidak dijumpai. Sila cuba lagi.</div>
    </div>

    <div id="resultSection" class="result-section">
      <div class="student-info">
        <div class="info-item">
          <span>Nama Pelajar</span>
          <strong id="studentName">-</strong>
        </div>
        <div class="info-item">
          <span>Nombor Matrik</span>
          <strong id="studentMatrik">-</strong>
        </div>
        <div class="info-item">
          <span>Kumpulan / Praktikum</span>
          <strong id="studentKumpulan">-</strong>
        </div>
      </div>

      <table class="marks-table">
        <thead>
          <tr>
            <th>Komponen Pentaksiran</th>
            <th>Markah Penuh</th>
            <th>Markah Diperoleh</th>
          </tr>
        </thead>
        <tbody id="marksBody">
          <!-- Data markah dimasukkan melalui JS -->
        </tbody>
      </table>

      <div class="action-buttons">
        <!-- Butang Cetak Slip Markah -->
        <button class="btn-action btn-print" onclick="window.print()">
          <i class="fa-solid fa-print"></i> Cetak Slip Markah
        </button>
        <!-- Butang Lihat PDF Tugasan -->
        <button class="btn-action btn-pdf" id="viewPdfBtn" onclick="openPdfModal()">
          <i class="fa-solid fa-file-pdf"></i> Lihat / Muat Turun Tugasan
        </button>
      </div>
    </div>
  </div>

  <!-- Modal untuk Paparan PDF -->
  <div id="pdfModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>Paparan Semakan Tugasan Individu</span>
        <span class="modal-close" onclick="closePdfModal()"><i class="fa-solid fa-xmark"></i></span>
      </div>
      <div class="modal-body">
        <iframe id="pdfFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <script>
    // Pangkalan Data Contoh
    const database = [
      {
        matrik: "MS23123456",
        nama: "Ahmad Bin Abdullah",
        kumpulan: "H1T1",
        quiz: 18,
        tugasan: 28,
        ujian: 42,
        pdfUrl: "https://drive.google.com/open?id=1IgCXFe2rTWKexLBZHUa2fQIulVX5Icwt"
      },
      {
        matrik: "MS23654321",
        nama: "Siti Nurhaliza Binti Abu",
        kumpulan: "H2T3",
        quiz: 20,
        tugasan: 30,
        ujian: 45,
        pdfUrl: "https://drive.google.com/file/d/1ANOTHEREXAMPLEID/preview"
      }
    ];

    let currentPdfUrl = "";

    function searchStudent() {
      const input = document.getElementById("matrikInput").value.trim().toUpperCase();
      const resultSection = document.getElementById("resultSection");
      const errorMsg = document.getElementById("errorMsg");

      const student = database.find(s => s.matrik === input);

      if (student) {
        errorMsg.style.display = "none";
        
        // Kemaskini Maklumat Pelajar
        document.getElementById("studentName").innerText = student.nama;
        document.getElementById("studentMatrik").innerText = student.matrik;
        document.getElementById("studentKumpulan").innerText = student.kumpulan;

        // Kemaskini Markah
        const marksBody = document.getElementById("marksBody");
        const totalMark = student.quiz + student.tugasan + student.ujian;
        
        marksBody.innerHTML = `
          <tr>
            <td>Kuiz</td>
            <td>20</td>
            <td>${student.quiz}</td>
          </tr>
          <tr>
            <td>Tugasan Individu</td>
            <td>30</td>
            <td>${student.tugasan}</td>
          </tr>
          <tr>
            <td>Ujian Pertengahan Semester</td>
            <td>50</td>
            <td>${student.ujian}</td>
          </tr>
          <tr style="font-weight: bold; background: #f8fafc;">
            <td>Jumlah Keseluruhan PB</td>
            <td>100</td>
            <td>${totalMark}</td>
          </tr>
        `;

        currentPdfUrl = student.pdfUrl;
        resultSection.style.display = "block";
      } else {
        resultSection.style.display = "none";
        errorMsg.style.display = "block";
      }
    }

    function openPdfModal() {
      if (currentPdfUrl) {
        document.getElementById("pdfFrame").src = currentPdfUrl;
        document.getElementById("pdfModal").style.display = "flex";
      }
    }

    function closePdfModal() {
      document.getElementById("pdfModal").style.display = "none";
      document.getElementById("pdfFrame").src = "";
    }
  </script>
</body>
</html>
